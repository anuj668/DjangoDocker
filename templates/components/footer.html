<script>


/* ==============================================================

const movieData = [

    {
        id: 1,

        title: "Project Alpha",

        status: "Pre-Release",

        releaseConfidence: "HIGH",

        confidencePercentage: 86,

        audienceIntent: 62.4,

        sentiment: 78.6,

        cityCount: 12,

        budget: "₹45 Cr",

        expectedRelease: "15 Oct 2026"
    },


    {
        id: 2,

        title: "Midnight Stories",

        status: "Pre-Release",

        releaseConfidence: "MEDIUM",

        confidencePercentage: 71,

        audienceIntent: 55.8,

        sentiment: 69.2,

        cityCount: 9,

        budget: "₹28 Cr",

        expectedRelease: "22 Nov 2026"
    },


    {
        id: 3,

        title: "The Last Journey",

        status: "Released",

        releaseConfidence: "HIGH",

        confidencePercentage: 92,

        audienceIntent: 81.7,

        sentiment: 88.4,

        cityCount: 21,

        budget: "₹72 Cr",

        expectedRelease: "Released"
    }


];



/* ==============================================================
   CALCULATE DASHBOARD
============================================================== */


function calculateDashboard() {


    const totalMovies =
        movieData.length;


    let audienceTotal = 0;

    let sentimentTotal = 0;

    let confidenceTotal = 0;

    let cityTotal = 0;


    movieData.forEach(movie => {

        audienceTotal +=
            movie.audienceIntent;

        sentimentTotal +=
            movie.sentiment;

        confidenceTotal +=
            movie.confidencePercentage;

        cityTotal +=
            movie.cityCount;

    });


    return {

        audience:
            (
                audienceTotal /
                totalMovies
            ).toFixed(1),

        sentiment:
            (
                sentimentTotal /
                totalMovies
            ).toFixed(1),

        confidence:
            Math.round(
                confidenceTotal /
                totalMovies
            ),

        cities:
            cityTotal

    };

}



/* ==============================================================
   UPDATE DASHBOARD METRICS
============================================================== */


function updateDashboard() {


    const data =
        calculateDashboard();


    document.getElementById(
        "audienceIntent"
    ).textContent =
        data.audience + "%";


    document.getElementById(
        "sentimentScore"
    ).textContent =
        data.sentiment;


    document.getElementById(
        "confidencePercentage"
    ).textContent =
        data.confidence + "%";


    document.getElementById(
        "cityCount"
    ).textContent =
        data.cities +
        " City Signals";


    /* CONFIDENCE LEVEL */

    let confidenceText;


    if (data.confidence >= 80) {

        confidenceText = "HIGH";

    }

    else if (data.confidence >= 60) {

        confidenceText = "MEDIUM";

    }

    else {

        confidenceText = "LOW";

    }


    document.getElementById(
        "releaseConfidence"
    ).textContent =
        confidenceText;


    /* AUDIENCE GROWTH */

    const growth =
        (
            data.audience - 50
        ).toFixed(1);


    document.getElementById(
        "audienceGrowth"
    ).textContent =
        "↑ " +
        growth +
        " pts";

}



/* ==============================================================
   AUDIENCE CHART
============================================================== */


function createAudienceChart() {


    const container =
        document.getElementById(
            "audienceChart"
        );


    container.innerHTML = "";


    const values = [

        25,
        38,
        32,
        48,
        42,
        60,
        53,
        68,
        62,
        82

    ];


    values.forEach(value => {


        const bar =
            document.createElement(
                "div"
            );


        bar.className =
            "chart-bar";


        bar.style.height =
            value + "%";


        container.appendChild(
            bar
        );

    });

}

        bar.style.height =

/* ==============================================================
   DISPLAY MOVIES
============================================================== */


function displayMovies() {


    const container =
        document.getElementById(
            "movieGrid"
        );


    container.innerHTML = "";


    movieData.forEach(movie => {


        const card =
            document.createElement(
                "div"
            );


        card.className =
            "movie-card";


        card.innerHTML = `

            <div class="movie-top">

                <div class="movie-title">

                    ${movie.title}

                </div>

                <div class="movie-status">

                    ${movie.status}

                </div>

            </div>


            <div class="movie-info">


                <div class="movie-stat">

                    <span>
                        Release Confidence
                    </span>

                    <strong>
                        ${movie.confidencePercentage}%
                    </strong>

                </div>


                <div class="movie-stat">

                    <span>
                        Audience Intent
                    </span>

                    <strong>
                        ${movie.audienceIntent}%
                    </strong>

                </div>


                <div class="movie-stat">

                    <span>
                        Sentiment Score
                    </span>

                    <strong>
                        ${movie.sentiment}
                    </strong>

                </div>


                <div class="movie-stat">

                    <span>
                        Cities
                    </span>

                    <strong>
                        ${movie.cityCount}
                    </strong>

                </div>


                <div class="movie-stat">

                    <span>
                        Budget
                    </span>

                    <strong>
                        ${movie.budget}
                    </strong>

                </div>


                <div class="movie-stat">

                    <span>
                        Release Date
                    </span>

                    <strong>
                        ${movie.expectedRelease}
                    </strong>

                </div>


            </div>

        `;


        container.appendChild(
            card
        );

    });

}



/* ==============================================================
   REFRESH
============================================================== */


function refreshDashboard() {


    updateDashboard();

    displayMovies();

    createAudienceChart();

    createCityChart();


    showToast(
        "Dashboard data refreshed successfully."
    );

}



/* ==============================================================
   TOAST
============================================================== */


function showToast(message) {


    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    setTimeout(
        () => {

            toast.classList.remove(
                "show"
            );

        },
        2500
    );

}

</script>
